<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e1dd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#778da9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Midnight Sky -->
  <rect width="600" height="450" fill="url(#nightGrad)" rx="12"/>

  <!-- Moon and Soft Glow -->
  <circle cx="480" cy="110" r="50" fill="url(#moonGlow)"/>
  <circle cx="475" cy="105" r="28" fill="#fdfbf7"/>
  <circle cx="486" cy="100" r="24" fill="#17223b"/>

  <!-- Starlight dots -->
  <circle cx="90" cy="65" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="150" cy="110" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="210" cy="45" r="2.5" fill="#fff" opacity="0.95"/>
  <circle cx="260" cy="95" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="340" cy="55" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="380" cy="120" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="120" cy="180" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="310" cy="160" r="2" fill="#fff" opacity="0.85"/>
  <circle cx="420" cy="200" r="1.5" fill="#fff" opacity="0.7"/>

  <!-- Subtle Constellation Lines -->
  <line x1="90" y1="65" x2="150" y2="110" stroke="#fff" stroke-width="0.8" opacity="0.3" stroke-dasharray="2,3"/>
  <line x1="150" y1="110" x2="210" y2="45" stroke="#fff" stroke-width="0.8" opacity="0.3" stroke-dasharray="2,3"/>
  <line x1="210" y1="45" x2="260" y2="95" stroke="#fff" stroke-width="0.8" opacity="0.3" stroke-dasharray="2,3"/>

  <!-- Distant City Skyline Silhouettes -->
  <rect x="50" y="270" width="40" height="180" fill="#0c1222"/>
  <rect x="100" y="240" width="35" height="210" fill="#090e1a"/>
  <rect x="145" y="280" width="45" height="170" fill="#0c1222"/>
  <rect x="200" y="220" width="55" height="230" fill="#070a14"/>
  <rect x="265" y="260" width="40" height="190" fill="#090e1a"/>
  <rect x="315" y="235" width="50" height="215" fill="#070a14"/>
  <rect x="375" y="275" width="45" height="175" fill="#0c1222"/>
  <rect x="430" y="250" width="40" height="200" fill="#090e1a"/>
  <rect x="480" y="290" width="60" height="160" fill="#0c1222"/>

  <!-- Little glowing city windows -->
  <circle cx="115" cy="265" r="2" fill="#ffb703" opacity="0.8"/>
  <circle cx="115" cy="285" r="2" fill="#ffb703" opacity="0.9"/>
  <circle cx="225" cy="245" r="2" fill="#ffb703" opacity="0.85"/>
  <circle cx="235" cy="275" r="2" fill="#ffb703" opacity="0.7"/>
  <circle cx="335" cy="255" r="2" fill="#ffb703" opacity="0.9"/>
  <circle cx="345" cy="285" r="2" fill="#ffb703" opacity="0.8"/>
  <circle cx="445" cy="275" r="2" fill="#ffb703" opacity="0.75"/>

  <!-- Subtle text caption inside svg -->
  <text x="300" y="415" font-family="'Georgia', serif" font-size="16" fill="#ccd5ae" text-anchor="middle" font-style="italic" opacity="0.9">"Talking until late while the city lights hummed in the background"</text>
</svg>
