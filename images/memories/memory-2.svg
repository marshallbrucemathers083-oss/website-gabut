<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c2f58"/>
      <stop offset="35%" stop-color="#b05279"/>
      <stop offset="65%" stop-color="#e76f51"/>
      <stop offset="85%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e9c46a"/>
    </linearGradient>
    <radialGradient id="sunDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff275"/>
      <stop offset="70%" stop-color="#f77f00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d62828" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sunset Sky -->
  <rect width="600" height="450" fill="url(#skyGrad)" rx="12"/>
  
  <!-- Glowing Sun -->
  <circle cx="300" cy="230" r="110" fill="url(#sunDisc)"/>
  
  <!-- Gentle Clouds -->
  <path d="M 80,180 Q 140,165 210,180 Q 250,195 210,205 Q 120,205 80,180 Z" fill="#ffffff" opacity="0.2"/>
  <path d="M 380,150 Q 450,135 520,155 Q 550,170 510,175 Q 420,180 380,150 Z" fill="#ffffff" opacity="0.25"/>
  <path d="M 230,220 Q 300,210 370,222 Q 400,230 360,235 Q 270,235 230,220 Z" fill="#ffd166" opacity="0.3"/>

  <!-- Distant mountain hills -->
  <path d="M 0,300 Q 150,250 300,290 Q 450,260 600,310 L 600,450 L 0,450 Z" fill="#4a2840" opacity="0.7"/>
  <path d="M 0,330 Q 180,290 350,330 Q 480,305 600,340 L 600,450 L 0,450 Z" fill="#2d1a29" opacity="0.9"/>

  <!-- Foreground silhouettes (trees & streetlight) -->
  <path d="M 70,450 L 70,300 Q 50,270 40,240 Q 70,245 75,270 Q 95,240 105,260 Q 80,285 75,300 L 75,450 Z" fill="#180e1a"/>
  <circle cx="65" cy="245" r="28" fill="#180e1a" opacity="0.95"/>
  <circle cx="85" cy="255" r="24" fill="#180e1a" opacity="0.95"/>
  
  <!-- Subtle text caption inside svg -->
  <text x="300" y="415" font-family="'Georgia', serif" font-size="16" fill="#fdf0d5" text-anchor="middle" font-style="italic" opacity="0.9">"Walking side by side while the sunset softened the world"</text>
</svg>
