<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a1d"/>
      <stop offset="50%" stop-color="#4a2830"/>
      <stop offset="100%" stop-color="#6a3843"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="40%" stop-color="#e09f3e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9e2a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" fill="url(#warmBg)" rx="12"/>

  <!-- Fairy lights hanging garland -->
  <path d="M 0,90 Q 150,150 300,100 Q 450,150 600,90" stroke="#f4a261" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Glowing bulbs along string -->
  <g>
    <circle cx="75" cy="122" r="18" fill="url(#lanternGlow)"/>
    <circle cx="75" cy="122" r="5" fill="#fffbe0"/>
    <circle cx="150" cy="138" r="22" fill="url(#lanternGlow)"/>
    <circle cx="150" cy="138" r="6" fill="#fffbe0"/>
    <circle cx="225" cy="122" r="18" fill="url(#lanternGlow)"/>
    <circle cx="225" cy="122" r="5" fill="#fffbe0"/>
    <circle cx="300" cy="100" r="24" fill="url(#lanternGlow)"/>
    <circle cx="300" cy="100" r="7" fill="#fffbe0"/>
    <circle cx="375" cy="122" r="18" fill="url(#lanternGlow)"/>
    <circle cx="375" cy="122" r="5" fill="#fffbe0"/>
    <circle cx="450" cy="138" r="22" fill="url(#lanternGlow)"/>
    <circle cx="450" cy="138" r="6" fill="#fffbe0"/>
    <circle cx="525" cy="122" r="18" fill="url(#lanternGlow)"/>
    <circle cx="525" cy="122" r="5" fill="#fffbe0"/>
  </g>

  <!-- Big central cozy lantern -->
  <circle cx="300" cy="270" r="120" fill="url(#lanternGlow)" opacity="0.65"/>
  <rect x="275" y="225" width="50" height="70" rx="8" fill="#ffd166" opacity="0.8"/>
  <path d="M 270,225 L 330,225 L 320,210 L 280,210 Z" fill="#540b0e"/>
  <rect x="270" y="295" width="60" height="12" rx="4" fill="#540b0e"/>
  <path d="M 290,210 Q 300,185 310,210" stroke="#540b0e" stroke-width="4" fill="none"/>
  <!-- Candle flame inside lantern -->
  <ellipse cx="300" cy="265" rx="8" ry="16" fill="#fff"/>
  <ellipse cx="300" cy="265" rx="5" ry="11" fill="#fca311"/>

  <!-- Subtle text caption inside svg -->
  <text x="300" y="415" font-family="'Georgia', serif" font-size="16" fill="#ffe8d6" text-anchor="middle" font-style="italic" opacity="0.9">"A quiet smile that lit up the whole evening"</text>
</svg>
