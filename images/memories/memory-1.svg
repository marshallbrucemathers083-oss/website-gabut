<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2f4c"/>
      <stop offset="50%" stop-color="#5a4768"/>
      <stop offset="100%" stop-color="#8a6b7e"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdf9e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fca311" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffb703" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" fill="url(#bg1)" rx="12"/>
  
  <!-- Window frame and warm light stream -->
  <polygon points="120,40 280,40 380,450 60,450" fill="url(#warmLight)" />
  
  <!-- Window arched outline -->
  <path d="M 140,80 A 60,60 0 0 1 260,80 L 260,260 L 140,260 Z" fill="#2b213a" opacity="0.6"/>
  <path d="M 145,85 A 55,55 0 0 1 255,85 L 255,160 L 145,160 Z" fill="#ffd166" opacity="0.3"/>
  <path d="M 145,170 L 255,170 L 255,255 L 145,255 Z" fill="#ffd166" opacity="0.2"/>
  
  <!-- Plants on windowsill -->
  <ellipse cx="200" cy="255" rx="35" ry="8" fill="#1e1828"/>
  <path d="M 180,250 Q 160,200 170,175 Q 185,210 185,250" fill="#70a288" opacity="0.8"/>
  <path d="M 200,250 Q 200,180 205,160 Q 215,200 205,250" fill="#84a98c" opacity="0.9"/>
  <path d="M 215,250 Q 235,210 240,185 Q 230,220 220,250" fill="#52796f" opacity="0.85"/>
  <rect x="185" y="248" width="30" height="22" rx="4" fill="#d4a373"/>
  
  <!-- Coffee cup with steam -->
  <rect x="360" y="320" width="32" height="26" rx="4" fill="#fefae0"/>
  <path d="M 392,326 C 402,326 402,338 392,338" stroke="#fefae0" stroke-width="3" fill="none"/>
  <path d="M 368,312 Q 366,300 372,290" stroke="#fdf0d5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 376,314 Q 380,302 376,294" stroke="#fdf0d5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Table surface -->
  <path d="M 0,335 L 600,335 L 600,450 L 0,450 Z" fill="#241e30" opacity="0.95"/>
  <line x1="0" y1="335" x2="600" y2="335" stroke="#443854" stroke-width="2"/>
  
  <!-- Subtle text caption inside svg -->
  <text x="300" y="405" font-family="'Georgia', serif" font-size="16" fill="#e9d8a6" text-anchor="middle" font-style="italic" opacity="0.9">"That quiet afternoon where time seemed to slow down"</text>
</svg>
